# Domain ownership validation while the application is still being verified.
server {
    listen 80;
    server_name skin.ysumc.net;
    root /data/program/ysumcusercentre/public;
    charset utf-8;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        add_header Retry-After 300 always;
        return 503 "YSUMC 用户中心正在部署，请稍后访问。\n";
    }
}
