# Initial verification on the deployment host. This listener is not public.
# Enable the domain/TLS virtual host only after local checks pass.
server {
    listen 127.0.0.1:13011;
    server_name skin.ysumc.net;
    root /www/wwwroot/ysumcusercentre/public;
    index index.php;
    client_max_body_size 512m;

    location /api/janus/ {
        proxy_pass http://127.0.0.1:13010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/janus {
        return 308 /api/janus/;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/tmp/php-cgi-81.sock;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
