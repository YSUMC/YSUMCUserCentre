[global]
pid = /www/wwwroot/ysumcusercentre/storage/runtime/php-fpm.pid
error_log = /www/wwwroot/ysumcusercentre/storage/logs/php-fpm.log
daemonize = no

[ysumc]
user = www
group = www
listen = /www/wwwroot/ysumcusercentre/storage/runtime/php-fpm.sock
listen.owner = www
listen.group = www
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500
catch_workers_output = yes
clear_env = yes
php_admin_value[open_basedir] = /www/wwwroot/ysumcusercentre:/tmp:/proc
php_admin_value[error_log] = /www/wwwroot/ysumcusercentre/storage/logs/php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_flag[session.upload_progress.enabled] = off
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 512M
php_admin_value[post_max_size] = 520M
