; Install as public/.user.ini for the BaoTa PHP 8.1 site.
open_basedir=/www/wwwroot/ysumcusercentre/:/tmp/:/proc/
memory_limit=256M
upload_max_filesize=512M
post_max_size=520M
session.upload_progress.enabled=Off
log_errors=On
display_errors=Off
error_log=/www/wwwroot/ysumcusercentre/storage/logs/php-error.log
