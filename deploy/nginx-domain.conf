# BaoTa PHP site: /www/server/panel/vhost/nginx/skin.ysumc.net.conf
server {
    listen 80;
    listen 443 ssl http2;
    server_name skin.ysumc.net;
    root /www/wwwroot/ysumcusercentre/public;
    index index.php;
    charset utf-8;
    client_max_body_size 512m;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/skin.ysumc.net.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/skin.ysumc.net/*.conf;

    #SSL-START
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ($uri ~ /\.well-known/) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        return 301 https://skin.ysumc.net$request_uri;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate /etc/letsencrypt/live/skin.ysumc.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skin.ysumc.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YSUMCTLS:10m;
    ssl_session_timeout 1d;
    #SSL-END

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location /api/janus/ {
        proxy_pass http://127.0.0.1:13010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/janus {
        return 308 /api/janus/;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # Only the Laravel front controller may execute PHP.
    location ~ ^/(?!index\.php$).*\.php(?:/|$) {
        return 404;
    }

    #PHP-INFO-START
    include enable-php-81.conf;
    #PHP-INFO-END

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/skin.ysumc.net.conf;
    #REWRITE-END

    access_log /www/wwwlogs/skin.ysumc.net.log;
    error_log /www/wwwlogs/skin.ysumc.net.error.log;
}
