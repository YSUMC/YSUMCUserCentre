# Enable only after the certificate exists and local application checks pass.
server {
    listen 80;
    server_name skin.ysumc.net;
    root /data/program/ysumcusercentre/public;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://skin.ysumc.net$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name skin.ysumc.net;
    root /data/program/ysumcusercentre/public;
    index index.php;
    charset utf-8;
    client_max_body_size 512m;

    ssl_certificate /etc/letsencrypt/live/skin.ysumc.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skin.ysumc.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YSUMCTLS:10m;
    ssl_session_timeout 1d;

    location /api/janus/ {
        proxy_pass http://127.0.0.1:13010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/janus {
        return 308 /api/janus/;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/data/program/ysumcusercentre/storage/runtime/php-fpm.sock;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
