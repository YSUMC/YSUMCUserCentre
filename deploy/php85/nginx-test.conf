user www www;
worker_processes 1;
pid /www/server/php-compat-assessments/20261022-migration/nginx.pid;
error_log /www/server/php-compat-assessments/20261022-migration/nginx-error.log;
events { worker_connections 128; }
http {
    lua_package_path "/www/server/nginx/lib/lua/?.lua;;";
    include /www/server/nginx/conf/mime.types;
    access_log /www/server/php-compat-assessments/20261022-migration/nginx-access.log;
    client_body_temp_path /www/wwwroot/ysumcusercentre-next/storage/framework/nginx/body;
    proxy_temp_path /www/wwwroot/ysumcusercentre-next/storage/framework/nginx/proxy;
    fastcgi_temp_path /www/wwwroot/ysumcusercentre-next/storage/framework/nginx/fastcgi;
    server {
        listen 127.0.0.1:13850;
        server_name localhost;
        root /www/wwwroot/ysumcusercentre-next/public;
        index index.php;
        client_max_body_size 12m;
        location ^~ /api/janus {
            proxy_pass http://127.0.0.1:13851;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location = /index.php {
            include /www/server/nginx/conf/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_pass 127.0.0.1:13853;
        }
        location ~ /\. { deny all; }
        location ~ \.php$ { return 404; }
    }
}
