[global]
pid = /www/server/php-compat-assessments/20261022-migration/php-fpm.pid
error_log = /www/server/php-compat-assessments/20261022-migration/php-fpm.log
daemonize = no
[candidate]
user = www
group = www
listen = 127.0.0.1:13853
listen.allowed_clients = 127.0.0.1
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 10s
chdir = /www/wwwroot/ysumcusercentre-next
catch_workers_output = yes
php_admin_flag[session.upload_progress.enabled] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
